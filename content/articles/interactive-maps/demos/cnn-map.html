<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свёрточная сеть — карта</title>
<style>
:root{
  --bg:#FFFFFF; --panel:#F4F5F7; --ink:#111111; --muted:#5E5850; --line:#D8D5CF; --grid:#BDB8B0; --dot:#E4E2DD;
  --blue:#3576C0; --yellow:#C29E08; --red:#C30B0A; --green:#73B222; --violet:#8A4FB8; --neg:#6F6A62;
  --btn:#1B1D26; --btnink:#FFFFFF; --tip:#1B1D26; --tipink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181D; --panel:#1E2127; --ink:#ECECEE; --muted:#A39D94; --line:#34373F; --grid:#555A63; --dot:#262930;
    --blue:#5E9CE3; --yellow:#DDB832; --red:#EF5350; --green:#8FCB48; --violet:#AB80DD; --neg:#8A857D;
    --btn:#ECECEE; --btnink:#16181D; --tip:#ECECEE; --tipink:#16181D;
  }
}
:root[data-theme="dark"]{
  --bg:#16181D; --panel:#1E2127; --ink:#ECECEE; --muted:#A39D94; --line:#34373F; --grid:#555A63; --dot:#262930;
  --blue:#5E9CE3; --yellow:#DDB832; --red:#EF5350; --green:#8FCB48; --violet:#AB80DD; --neg:#8A857D;
  --btn:#ECECEE; --btnink:#16181D; --tip:#ECECEE; --tipink:#16181D;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
#stage{position:relative;overflow:hidden;min-height:0;min-width:0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}

/* SVG content */
#map .rtitle{font-size:28px;font-weight:800;fill:var(--ink)}
#map .sent{font-size:20px;fill:var(--ink)}
#map .lbl{font-size:13px;fill:var(--muted);text-anchor:middle}
#map .lbl-l{font-size:13px;fill:var(--muted)}
#map .mname{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:19px;fill:var(--ink);text-anchor:middle}
#map .mname .ss{font-size:13px}
#map .shape{font-size:11px;fill:var(--muted);text-anchor:middle}
#map .op{font-family:"Times New Roman",Times,serif;font-size:28px;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
#map .opl{font-size:14px;font-weight:700;text-anchor:middle}
#map .c{stroke:var(--grid);stroke-width:.5}
#map .cv{text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:Helvetica,Arial,sans-serif}
#map .frame{fill:none;stroke:var(--ink);stroke-width:1.2;pointer-events:none}
#map .blk{stroke:var(--ink);stroke-width:2.2;pointer-events:none;opacity:.8}
#map .win{fill:none;stroke:var(--ink);stroke-width:1.6;pointer-events:none}
#map .chl{font-size:13px;fill:var(--muted);text-anchor:end;dominant-baseline:central}
#map .conn{fill:none;stroke:var(--muted);stroke-width:1.6}
#map .dash{stroke-dasharray:6 5}
#map .px{pointer-events:none}
#map .thumb{fill:transparent;stroke:var(--grid);stroke-width:1.2;cursor:pointer}
#map .thumb.sel{stroke:var(--ink);stroke-width:2.5}
#map .slab{stroke:var(--ink);stroke-width:1}
#map .axis{stroke:var(--muted);stroke-width:1}
#map [data-k]{transition:opacity .35s}
#map .dim{opacity:.13}
#map[data-hl] .c{opacity:.45}
#map .c.hot{opacity:1;stroke:var(--ink);stroke-width:1.5}
#map .thumb.hot{stroke:var(--blue);stroke-width:3}
@media (prefers-reduced-motion: reduce){ #map [data-k]{transition:none} }

/* panel */
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.progress{display:flex;gap:3px;padding:16px 22px 0}
.progress button{flex:1;height:8px;border:0;border-radius:2px;background:var(--line);padding:0;cursor:pointer}
.progress button.done{background:var(--muted)}
.progress button.cur{background:var(--ink)}
.scroll{flex:1;overflow:auto;padding:18px 22px 8px}
.count{font-size:14px;color:var(--muted)}
h1{font-size:25px;line-height:1.15;margin:6px 0 12px;font-weight:800}
.text{font-size:15.5px;line-height:1.5;margin:0 0 14px;max-width:62ch}
.text b{font-weight:700}
.formula{font-family:"Times New Roman",Times,serif;font-size:21px;line-height:1.5;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow-x:auto}
.formula:empty{display:none}
.formula .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;margin:0 .15em}
.formula .frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}
.formula .note{display:block;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:var(--muted);margin-top:4px}
.live{font-size:14px;line-height:1.45;margin:0 0 10px;padding-left:12px;border-left:3px solid var(--blue)}
.live:empty{display:none}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13.5px;align-items:center;margin:4px 0 12px}
.sw{width:18px;height:14px;border-radius:3px;display:inline-block}
.sw.ramp{background:linear-gradient(90deg,color-mix(in srgb,var(--blue) 10%,transparent),var(--blue))}
.controls{border-top:1px solid var(--line);padding:12px 22px;display:grid;gap:10px;font-size:14px}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crow .k{color:var(--muted);min-width:70px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:34px;height:30px;padding:0 9px;border-radius:7px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.3;cursor:default}
input[type=range]{flex:1;min-width:120px;accent-color:var(--green)}
.ghost{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:13.5px;cursor:pointer}
.ghost.go{border-color:var(--green);font-weight:700}
.stat{color:var(--muted);font-size:13px}
nav{display:flex;gap:10px;padding:12px 22px 18px;align-items:center}
nav .prev{width:52px;height:48px;border-radius:12px;border:1.5px solid var(--btn);background:transparent;color:var(--ink);font-size:22px;font-weight:800;cursor:pointer}
nav .next{flex:1;height:48px;border-radius:12px;border:0;background:var(--btn);color:var(--btnink);font-size:17px;font-weight:800;cursor:pointer}
button:focus-visible,input:focus-visible,#map:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
#tip{position:absolute;pointer-events:none;background:var(--tip);color:var(--tipink);font-size:13px;padding:6px 9px;border-radius:7px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
#recenter{position:absolute;right:14px;top:14px;display:none;z-index:4}
.hint{position:absolute;left:14px;bottom:12px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,50%) minmax(0,50%)}
  aside{border-left:0;border-top:1px solid var(--line)}
  h1{font-size:21px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div id="stage">
    <svg id="map" tabindex="0" aria-label="Карта свёрточной сети: прямой проход, обратный проход и шаг обучения" viewBox="0 0 3300 1800" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tip"></div>
    <button id="recenter" class="ghost">Вернуть камеру к шагу</button>
    <div class="hint">Тяни — двигать, колесо — масштаб, наведи на клетку — окно, из которого она посчитана</div>
  </div>
  <aside>
    <div class="progress" id="progress"></div>
    <div class="scroll">
      <div class="count" id="count"></div>
      <h1 id="title"></h1>
      <div class="text" id="text"></div>
      <div class="formula" id="formula"></div>
      <p class="live" id="live"></p>
    </div>
    <div class="controls">
      <div class="crow"><span class="k">Картинка</span><div class="seg" id="samples"></div></div>
      <div class="crow"><span class="k">Окно</span><div class="seg" id="wins">
        <button id="wprev" aria-label="Окно назад">‹</button><button id="wplay" aria-label="Пауза">❚❚</button><button id="wnext" aria-label="Окно вперёд">›</button>
      </div><span class="stat" id="wstat"></span></div>
      <div class="crow"><span class="k" id="etal">η = 0.50</span><input type="range" id="eta" min="0.05" max="3" step="0.05" value="0.5" aria-label="Скорость обучения η"></div>
      <div class="crow">
        <button class="ghost go" id="train1">Шаг обучения</button>
        <button class="ghost go" id="train10">×10</button>
        <button class="ghost" id="reseed">Новые веса</button>
        <span class="stat" id="stat"></span>
      </div>
    </div>
    <nav>
      <button class="prev" id="prev" aria-label="Назад">←</button>
      <button class="next" id="next">Далее</button>
    </nav>
  </aside>
</div>

<script>
(function(){
"use strict";
/* ---------- data: 6 картинок 8×8 из набора digits (UCI / scikit-learn), значения 0…16 ---------- */
const IDN=['№0','№1','№7','№10','№11','№17'];
const CLS=[0,1,2,0,1,2];
const CN=['0','1','7'];
const RAW=[
 [[0,0,5,13,9,1,0,0],[0,0,13,15,10,15,5,0],[0,3,15,2,0,11,8,0],[0,4,12,0,0,8,8,0],[0,5,8,0,0,9,8,0],[0,4,11,0,1,12,7,0],[0,2,14,5,10,12,0,0],[0,0,6,13,10,0,0,0]],
 [[0,0,0,12,13,5,0,0],[0,0,0,11,16,9,0,0],[0,0,3,15,16,6,0,0],[0,7,15,16,16,2,0,0],[0,0,1,16,16,3,0,0],[0,0,1,16,16,6,0,0],[0,0,1,16,16,6,0,0],[0,0,0,11,16,10,0,0]],
 [[0,0,7,8,13,16,15,1],[0,0,7,7,4,11,12,0],[0,0,0,0,8,13,1,0],[0,4,8,8,15,15,6,0],[0,2,11,15,15,4,0,0],[0,0,0,16,5,0,0,0],[0,0,9,15,1,0,0,0],[0,0,13,5,0,0,0,0]],
 [[0,0,1,9,15,11,0,0],[0,0,11,16,8,14,6,0],[0,2,16,10,0,9,9,0],[0,1,16,4,0,8,8,0],[0,4,16,4,0,8,8,0],[0,1,16,5,1,11,3,0],[0,0,12,12,10,10,0,0],[0,0,1,10,13,3,0,0]],
 [[0,0,0,0,14,13,1,0],[0,0,0,5,16,16,2,0],[0,0,0,14,16,12,0,0],[0,1,10,16,16,12,0,0],[0,3,12,14,16,9,0,0],[0,0,0,5,16,15,0,0],[0,0,0,4,16,14,0,0],[0,0,0,1,13,16,1,0]],
 [[0,0,1,8,15,10,0,0],[0,3,13,15,14,14,0,0],[0,5,10,0,10,12,0,0],[0,0,3,5,15,10,2,0],[0,0,16,16,16,16,12,0],[0,1,8,12,14,8,3,0],[0,0,0,10,13,0,0,0],[0,0,0,11,9,0,0,0]]
];
const N=6,C=22,C1=2,C2=3,NF=12;
const XS=RAW.map(im=>im.map(r=>r.map(v=>v/16)));
const Y=CLS.map(c=>[0,1,2].map(k=>k===c?1:0));
const state={step:0,sample:0,eta:.5,seed:141,free:false,P:null,hist:[],iter:0,win:0,playing:true};
const svg=document.getElementById('map');

/* ---------- math ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const randM=(r,n,m,s)=>Array.from({length:n},()=>Array.from({length:m},()=>gauss(r)*s));
const mm=(A,B)=>A.map(row=>B[0].map((_,j)=>row.reduce((s,a,k)=>s+a*B[k][j],0)));
const T=A=>A[0].map((_,j)=>A.map(r=>r[j]));
const zeros=(...d)=>d.length===1?Array(d[0]).fill(0):Array.from({length:d[0]},()=>zeros(...d.slice(1)));
const mean=r=>r.reduce((s,v)=>s+v,0)/r.length;
const norm=A=>Math.sqrt(A.flat(4).reduce((s,v)=>s+v*v,0));
const relu=v=>Math.max(0,v);
const mapD=(A,f)=>Array.isArray(A)?A.map(a=>mapD(a,f)):f(A);
const zipD=(A,B,f)=>Array.isArray(A)?A.map((a,i)=>zipD(a,B[i],f)):f(A,B);

// «свёртка» в смысле DL — взаимная корреляция: без разворота ядра
function conv(Xin,K,b){
  const Cin=Xin.length,H=Xin[0].length,Ho=H-2;
  return K.map((kk,k)=>Array.from({length:Ho},(_,i)=>Array.from({length:Ho},(_,j)=>{
    let s=b[k];for(let c=0;c<Cin;c++)for(let u=0;u<3;u++)for(let v=0;v<3;v++)s+=Xin[c][i+u][j+v]*kk[c][u][v];return s;})));
}
function init(){
  const r=rng(state.seed);
  state.P={
    K1:Array.from({length:C1},()=>[randM(r,3,3,Math.sqrt(2/9))]),
    b1:Array.from({length:C1},()=>gauss(r)*.05),
    K2:Array.from({length:C2},()=>Array.from({length:C1},()=>randM(r,3,3,Math.sqrt(2/18)))),
    b2:Array.from({length:C2},()=>gauss(r)*.05),
    W:randM(r,NF,3,Math.sqrt(1/NF)),
    b3:[Array.from({length:3},()=>gauss(r)*.05)]
  };
  state.iter=0;state.hist=[forward(state.P).L];
}
function fwdImg(P,x){
  const X=[x];
  const Z1=conv(X,P.K1,P.b1),A1=mapD(Z1,relu);
  const Z2=conv(A1,P.K2,P.b2),A2=mapD(Z2,relu);
  const P2=[],AM=[];
  for(let k=0;k<C2;k++){P2.push([]);AM.push([]);for(let i=0;i<2;i++){P2[k].push([]);AM[k].push([]);for(let j=0;j<2;j++){
    let best=-1e9,bi=0,bj=0;for(let a=0;a<2;a++)for(let c=0;c<2;c++){const v=A2[k][2*i+a][2*j+c];if(v>best){best=v;bi=2*i+a;bj=2*j+c;}}
    P2[k][i].push(best);AM[k][i].push([bi,bj]);}}}
  const f=P2.flat(2);          // порядок: фильтр, строка, столбец (как view(N,-1) в PyTorch)
  return {X,Z1,A1,Z2,A2,P2,AM,f};
}
function forward(P){
  const im=XS.map(x=>fwdImg(P,x));
  const F=im.map(o=>o.f);
  const Z3=mm(F,P.W).map(r=>r.map((v,j)=>v+P.b3[0][j]));
  const Pr=Z3.map(r=>{const m=Math.max(...r);const e=r.map(v=>Math.exp(v-m));const z=e.reduce((a,b)=>a+b,0);return e.map(v=>v/z);});
  const l=Pr.map((r,i)=>[-Math.log(r[CLS[i]])]);
  return {im,F,Z3,Pr,l,L:mean(l.map(r=>r[0]))};
}
function compute(){
  const P=state.P,f=forward(P);
  const PmY=f.Pr.map((r,i)=>r.map((p,j)=>p-Y[i][j]));
  const dZ3=PmY.map(r=>r.map(v=>v/N));
  const dW=mm(T(f.F),dZ3),db3=[dZ3[0].map((_,j)=>dZ3.reduce((s,r)=>s+r[j],0))];
  const dF=mm(dZ3,T(P.W));
  const dK2=zeros(C2,C1,3,3),db2=zeros(C2),dK1=zeros(C1,1,3,3),db1=zeros(C1);
  const bim=f.im.map((o,n)=>{
    const dP2=[0,1,2].map(k=>[0,1].map(i=>[0,1].map(j=>dF[n][k*4+i*2+j])));
    const dA2=zeros(C2,4,4);
    for(let k=0;k<C2;k++)for(let i=0;i<2;i++)for(let j=0;j<2;j++){const [a,b]=o.AM[k][i][j];dA2[k][a][b]+=dP2[k][i][j];}
    const M2=mapD(o.Z2,v=>v>0?1:0),dZ2=zipD(dA2,M2,(a,b)=>a*b);
    const dA1=zeros(C1,6,6);
    for(let k=0;k<C2;k++)for(let i=0;i<4;i++)for(let j=0;j<4;j++){
      const g=dZ2[k][i][j];db2[k]+=g;
      for(let c=0;c<C1;c++)for(let u=0;u<3;u++)for(let v=0;v<3;v++){dK2[k][c][u][v]+=g*o.A1[c][i+u][j+v];dA1[c][i+u][j+v]+=g*P.K2[k][c][u][v];}
    }
    const M1=mapD(o.Z1,v=>v>0?1:0),dZ1=zipD(dA1,M1,(a,b)=>a*b);
    for(let k=0;k<C1;k++)for(let i=0;i<6;i++)for(let j=0;j<6;j++){
      const g=dZ1[k][i][j];db1[k]+=g;
      for(let u=0;u<3;u++)for(let v=0;v<3;v++)dK1[k][0][u][v]+=g*o.X[0][i+u][j+v];
    }
    return {dP2,dA2,M2,dZ2,dA1,M1,dZ1};
  });
  const G={K1:dK1,b1:db1,K2:dK2,b2:db2,W:dW,b3:db3};
  const U={};for(const k in P)U[k]=zipD(P[k],G[k],(w,g)=>w-state.eta*g);
  const Lnext=forward(U).L;
  return {...f,P,PmY,dZ3,dW,db3,dF,bim,G,U,Lnext};
}
function trainSteps(n){for(let t=0;t<n;t++){const d=compute();state.P=d.U;state.iter++;state.hist.push(d.Lnext);}}

/* ---------- ключи подсветки ---------- */
const kx=(r,c)=>`x:${r}:${c}`, kc1=(k,i,j)=>`c1:${k}:${i}:${j}`, kk1=(k,u,v)=>`k1:${k}:${u}:${v}`, kb1=k=>`b1:${k}`;
const kc2=(k,i,j)=>`c2:${k}:${i}:${j}`, kk2=(k,c,u,v)=>`k2:${k}:${c}:${u}:${v}`, kb2=k=>`b2:${k}`, kp=(k,i,j)=>`p:${k}:${i}:${j}`;
const ks=n=>`s:${n}`, km=m=>`m:${m}`, kcl=c=>`c:${c}`, ksm=(n,m)=>`sm:${n}:${m}`;
const R=n=>[...Array(n).keys()];
function related(p){
  const a=p.split(':'),t=a[0],v=a.slice(1).map(Number),o=[p];
  if(t==='x'){const [r,c]=v;R(C1).forEach(k=>R(6).forEach(i=>R(6).forEach(j=>{if(r-i>=0&&r-i<3&&c-j>=0&&c-j<3)o.push(kc1(k,i,j));})));}
  else if(t==='c1'){const [k,i,j]=v;R(3).forEach(u=>R(3).forEach(w=>{o.push(kx(i+u,j+w),kk1(k,u,w));}));o.push(kb1(k));}
  else if(t==='k1'){const [k,u,w]=v;R(6).forEach(i=>R(6).forEach(j=>o.push(kc1(k,i,j),kx(i+u,j+w))));}
  else if(t==='b1'){R(6).forEach(i=>R(6).forEach(j=>o.push(kc1(v[0],i,j))));}
  else if(t==='c2'){const [k,i,j]=v;R(C1).forEach(c=>R(3).forEach(u=>R(3).forEach(w=>o.push(kc1(c,i+u,j+w),kk2(k,c,u,w)))));o.push(kb2(k));}
  else if(t==='k2'){const [k,c,u,w]=v;R(4).forEach(i=>R(4).forEach(j=>o.push(kc2(k,i,j),kc1(c,i+u,j+w))));}
  else if(t==='b2'){R(4).forEach(i=>R(4).forEach(j=>o.push(kc2(v[0],i,j))));}
  else if(t==='p'){const [k,i,j]=v;R(2).forEach(x=>R(2).forEach(y=>o.push(kc2(k,2*i+x,2*j+y))));o.push(ksm(state.sample,k*4+i*2+j));}
  return o;
}

/* ---------- svg builders ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function nm(s){
  let out='',i=0;
  while(i<s.length){
    const ch=s[i];
    if(ch==='_'||ch==='^'){
      let t;
      if(s[i+1]==='{'){const e=s.indexOf('}',i);t=s.slice(i+2,e);i=e+1;}else{t=s[i+1];i+=2;}
      const dy=ch==='_'?5:-8;
      out+=`<tspan class="ss" dy="${dy}">${esc(t)}</tspan><tspan dy="${-dy}">\u200a</tspan>`;
    }else{
      let j=i;while(j<s.length&&s[j]!=='_'&&s[j]!=='^')j++;
      out+=`<tspan>${esc(s.slice(i,j))}</tspan>`;i=j;
    }
  }
  return out;
}
function fmt(v){
  const a=Math.abs(v);
  let s=a<.995?a.toFixed(2).slice(1):(a<9.95?a.toFixed(1):a.toFixed(0));
  if(s==='.00')return '0';
  return (v<0?'−':'')+s;
}
const f2=v=>(Math.abs(v)<.005?0:v).toFixed(2).replace('-','−');
const f3=v=>v.toFixed(3).replace('-','−');
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const MATS={};
const uniq=a=>[...new Set(a)];
/* grid: o = {hue,max,int,label,desc(i,j),h(i,j)→ключи-членство,t(i,j)→ключи-триггер,blocks,mark(i,j)} */
function grid(id,M,x,y,o){
  const n=M.length,m=M[0].length;
  const mx=o.max||Math.max(1e-9,...M.flat().map(Math.abs));
  MATS[id]={M,label:o.label,desc:o.desc};
  let s='';
  for(let i=0;i<n;i++)for(let j=0;j<m;j++){
    const v=M[i][j],a=Math.min(1,Math.abs(v)/mx);
    const fill=v<0?'var(--neg)':o.hue;
    const op=isDark()?.14+.84*a:.07+.83*a;
    const tc=op>.52?'#fff':'var(--ink)';
    const X0=x+j*C,Y0=y+i*C;
    const h=o.h?o.h(i,j):[];
    const t=o.t?o.t(i,j):uniq(h.flatMap(related));
    s+=`<rect class="c" x="${X0}" y="${Y0}" width="${C}" height="${C}" style="fill:${fill};fill-opacity:${op.toFixed(3)}" data-m="${id}" data-i="${i}" data-j="${j}" data-h="${h.join(' ')}" data-t="${t.join(' ')}"/>`;
    s+=`<text class="cv" x="${X0+C/2}" y="${Y0+C/2+.5}" style="fill:${tc};font-size:${(C*.34).toFixed(1)}px">${o.int?String(v):fmt(v)}</text>`;
  }
  if(o.blocks){for(let q=o.blocks;q<n;q+=o.blocks)s+=`<line class="blk" x1="${x}" y1="${y+q*C}" x2="${x+m*C}" y2="${y+q*C}"/>`;for(let q=o.blocks;q<m;q+=o.blocks)s+=`<line class="blk" x1="${x+q*C}" y1="${y}" x2="${x+q*C}" y2="${y+n*C}"/>`;}
  if(o.mark)for(let i=0;i<n;i++)for(let j=0;j<m;j++)if(o.mark(i,j))s+=`<rect class="win" x="${x+j*C+2}" y="${y+i*C+2}" width="${C-4}" height="${C-4}" rx="3"/>`;
  s+=`<rect class="frame" x="${x}" y="${y}" width="${m*C}" height="${n*C}"/>`;
  return s;
}
const g=(key,inner)=>`<g data-k="${key}">${inner}</g>`;
const mname=(x,y,name)=>`<text class="mname" x="${x}" y="${y}">${nm(name)}</text>`;
const shape=(x,y,t)=>`<text class="shape" x="${x}" y="${y}">${t}</text>`;
/* одиночная матрица, центр по вертикали yc */
function mat(key,id,M,x,yc,o){
  const n=M.length,m=M[0].length,y=yc-n*C/2;
  return g(key,(o.name?mname(x+m*C/2,y-10,o.name):'')+(o.noShape?'':shape(x+m*C/2,y+n*C+14,o.shape||`${n} × ${m}`))+grid(id,M,x,y,o));
}
/* стопка каналов: maps[k] — 2D, центры по вертикали cy[k] */
function stack(key,id,maps,x,cy,o){
  const mx=o.max||Math.max(1e-9,...maps.flat(2).map(Math.abs));
  const n=maps[0].length,w=maps[0][0].length*C;
  let s=o.name?mname(x+w/2,cy[0]-n*C/2-10,o.name):'';
  s+=shape(x+w/2,cy[cy.length-1]+n*C/2+14,o.shape);
  maps.forEach((M,k)=>{
    s+=grid(id+k,M,x,cy[k]-n*C/2,{...o,max:mx,label:o.label(k),desc:(i,j)=>o.desc(k,i,j),h:(i,j)=>o.h(k,i,j),mark:o.mark?(i,j)=>o.mark(k,i,j):null});
    if(o.chl)s+=`<text class="chl" x="${x-7}" y="${cy[k]}">${o.chl(k)}</text>`;
  });
  return g(key,s);
}
const op=(x,y,t,st)=>`<text class="op" x="${x}" y="${y}"${st?` style="${st}"`:''}>${t}</text>`;
const MK={red:'ar-red',green:'ar-green',yellow:'ar-yellow'};
const mkFor=col=>{for(const k in MK)if(col.includes(k))return MK[k];return 'ar-gray';};
function arrow(x1,y,x2,label,col,below){
  col=col||'var(--muted)';
  return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" class="conn" style="stroke:${col}" marker-end="url(#${mkFor(col)})"/>`+
    (label?`<text class="opl" x="${(x1+x2)/2}" y="${below?y+22:y-10}" style="fill:${col}">${label}</text>`:'');
}

  for(let u=0;u<3;u++)for(let v=0;v<3;v++){s1+=o.A1[0][i+u][j+v]*K[0][u][v];s2+=o.A1[1][i+u][j+v]*K[1][u][v];}

}

 {t:'Градиент ядра: сумма по всем позициям',cam:['a1','k2','dk2','db2','dz2','r-dk2'],focus:['a1','dk2','db2','dz2','r-dk2'],
  text:()=>`Каждый вес ядра работал в 16 позициях окна. В каждой он умножался на свой пиксель A₁ и влиял на свою клетку Z₂. Поэтому его градиент — <b>сумма 16 вкладов</b> «пиксель × градиент клетки», и ещё сумма по 6 картинкам. Получается снова свёртка: A₁ со «скользящим ядром» dZ₂. db₂ — просто сумма dZ₂.`,
  formula:()=>`dK<sub>2</sub>[k, c, u, v] = Σ<sub>n</sub> Σ<sub>i,j</sub> dZ<sub>2</sub>[k, i, j] · A<sub>1</sub>[c, i+u, j+v]<span class="note">форма 3 × 2 × 3 × 3 — ровно как у K₂</span>`,

  text:()=>`Через ReLU получаем dZ₁, из него — dK₁ (свёртка X с dZ₁, сумма по 36 позициям и 6 картинкам) и db₁. На этом всё: градиент по пикселям не нужен, их не обучают.`,

 {t:'Шаг градиентного спуска',cam:['k1','b1','dk1','db1','ua1','uk1','ub1'],focus:['k1','b1','dk1','db1','dk2','db2','dw','db3',...UPD],
  text:()=>`Крупно — первый слой: K₁ сверху, dK₁ под ним, новое K₁′ ещё ниже, клетка в клетку. Так же одновременно обновляются K₂, W и все смещения — все 116 параметров.`,

  live:()=>{const d=state.d;return `С η = ${state.eta.toFixed(2)} потеря после шага: ${f3(d.L)} → <b>${f3(d.Lnext)}</b>${d.Lnext>d.L?' — выросла: шаг слишком большой':''}.`;}},

  text:()=>`Нажимай «Шаг обучения» или «×10». Каждый раз заново считаются все карты, градиенты и обновления. Смотри, как P приближается к Y, как меняются ядра K₁ и какие места картинки начинают «зажигать» фильтры. На 6 картинках сеть быстро выучит их наизусть; на настоящих данных брали бы тысячи картинок мини-батчами.`,

];
const NS=STEPS.length;

/* ---------- camera ---------- */
let vb={x:0,y:0,w:3300,h:1800};
function setVB(b){vb=b;svg.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);}
function bboxKeys(keys){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  const els=keys?keys.flatMap(k=>[...svg.querySelectorAll(`[data-k="${k}"]`)]):[...svg.querySelectorAll('[data-k]')];
  els.forEach(el=>{const b=el.getBBox();if(!b.width&&!b.height)return;x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);x2=Math.max(x2,b.x+b.width);y2=Math.max(y2,b.y+b.height);});
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function fit(b){
  const r=svg.getBoundingClientRect();const ar=r.width/Math.max(1,r.height);
  const pad=Math.max(b.w,b.h)*.05+36;
  let x=b.x-pad,y=b.y-pad,w=b.w+2*pad,h=b.h+2*pad;
  if(w<600){x-=(600-w)/2;w=600;}
  if(w/h>ar){const nh=w/ar;y-=(nh-h)/2;h=nh;}else{const nw=h*ar;x-=(nw-w)/2;w=nw;}
  return {x,y,w,h};
}
let anim=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(t){
  if(anim)cancelAnimationFrame(anim);
  if(reduce){setVB(t);return;}
  const f={...vb},t0=performance.now(),dur=750;
  const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  const tick=now=>{const u=Math.min(1,(now-t0)/dur),e=ease(u);
    setVB({x:f.x+(t.x-f.x)*e,y:f.y+(t.y-f.y)*e,w:f.w+(t.w-f.w)*e,h:f.h+(t.h-f.h)*e});
    if(u<1)anim=requestAnimationFrame(tick);};
  anim=requestAnimationFrame(tick);
}
const val=v=>typeof v==='function'?v():v;
function camera(){const st=STEPS[state.step];flyTo(fit(bboxKeys(val(st.cam))));}

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
function stepKeys(){
  const st=STEPS[state.step];
  if(st.win){const [i,j]=winIJ();return related(st.win===1?kc1(0,i,j):kc2(0,i,j));}
  return val(st.hl)||null;
}
function applyFocus(){
  const F=new Set(val(STEPS[state.step].focus)||[]);
  svg.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;el.classList.toggle('dim',F.size>0&&!F.has(k)&&!k.startsWith('title'));});
  hl(null);
}
function panel(){
  const st=STEPS[state.step];
  $('count').textContent=`${state.step+1} из ${NS}`;
  $('title').textContent=st.t;
  $('text').innerHTML=st.text();
  $('formula').innerHTML=st.formula();
  $('live').innerHTML=st.live();
  $('prev').style.visibility=state.step===0?'hidden':'visible';
  $('next').textContent=state.step===NS-1?'↻':'Далее';
  $('next').setAttribute('aria-label',state.step===NS-1?'В начало':'Далее');
  [...$('progress').children].forEach((b,i)=>{b.className=i===state.step?'cur':(i<state.step?'done':'');});
  [...$('samples').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===state.sample)));
  ['wprev','wplay','wnext'].forEach(id=>$(id).disabled=!st.win);
  $('wplay').textContent=state.playing?'❚❚':'▶';$('wplay').setAttribute('aria-label',state.playing?'Пауза':'Запустить');
  $('wstat').textContent=st.win?`позиция ${state.win%WIN[st.win].n+1} из ${WIN[st.win].n}`:'на шагах со свёрткой';
  $('etal').textContent=`η = ${state.eta.toFixed(2)}`;
  $('stat').textContent=`итерация ${state.iter} · seed ${state.seed}`;
}
function go(i){state.step=(i+NS)%NS;state.free=false;state.win=0;$('recenter').style.display='none';panel();applyFocus();drawWin();camera();}
function rebuild(){build();applyFocus();panel();}
function selectSample(n){state.sample=n;rebuild();}

STEPS.forEach((s,i)=>{const b=document.createElement('button');b.title=`${i+1}. ${s.t}`;b.setAttribute('aria-label',`Шаг ${i+1}: ${s.t}`);b.onclick=()=>go(i);$('progress').appendChild(b);});
IDN.forEach((n,i)=>{const b=document.createElement('button');b.textContent=CN[CLS[i]];b.title=`Картинка ${n}`;b.setAttribute('aria-label',`Картинка ${n}, цифра ${CN[CLS[i]]}`);b.onclick=()=>selectSample(i);$('samples').appendChild(b);});
function moveWin(dx){const st=STEPS[state.step];if(!st.win)return;const n=WIN[st.win].n;state.win=(state.win+dx+n)%n;if(!hovering)hl(null);drawWin();$('live').innerHTML=st.live();$('wstat').textContent=`позиция ${state.win+1} из ${n}`;}
$('wprev').onclick=()=>{state.playing=false;moveWin(-1);panel();};
$('wnext').onclick=()=>{state.playing=false;moveWin(1);panel();};
$('wplay').onclick=()=>{state.playing=!state.playing;panel();};
if(reduce)state.playing=false;
setInterval(()=>{if(state.playing&&!hovering&&STEPS[state.step].win&&!document.hidden)moveWin(1);},900);
$('prev').onclick=()=>go(state.step-1);
$('next').onclick=()=>go(state.step+1);
$('eta').oninput=e=>{state.eta=+e.target.value;rebuild();};
$('train1').onclick=()=>{trainSteps(1);rebuild();};
$('train10').onclick=()=>{trainSteps(10);rebuild();};
$('reseed').onclick=()=>{state.seed=1+Math.floor(Math.random()*9999);init();rebuild();};
$('recenter').onclick=()=>go(state.step);
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){go(state.step+1);e.preventDefault();}
  if(e.key==='ArrowLeft'&&state.step>0){go(state.step-1);e.preventDefault();}
});

/* ---------- hover ---------- */
const tip=$('tip'),stage=$('stage');
let IDX=new Map(),hot=[],hovering=false;
function indexHover(){
  IDX=new Map();hot=[];
  svg.querySelectorAll('[data-h]').forEach(el=>{el.dataset.h.split(' ').forEach(k=>{if(!k)return;if(!IDX.has(k))IDX.set(k,[]);IDX.get(k).push(el);});});
}
function hl(keys){
  hot.forEach(el=>el.classList.remove('hot'));hot=[];
  if(!keys)keys=stepKeys();
  if(!keys||!keys.length){delete svg.dataset.hl;return;}
  svg.dataset.hl='1';
  keys.forEach(k=>(IDX.get(k)||[]).forEach(el=>{el.classList.add('hot');hot.push(el);}));
}
function showTip(e,html){
  tip.innerHTML=html;
  const r=stage.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;
  tip.style.opacity=1;const tw=tip.offsetWidth;if(x+tw>r.width-8)x=e.clientX-r.left-tw-14;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
svg.addEventListener('pointermove',e=>{
  if(drag)return;
  const el=e.target,cls=el.classList;
  if(cls&&cls.contains('c')){
    const m=MATS[el.dataset.m],i=+el.dataset.i,j=+el.dataset.j,v=m.M[i][j];
    const ds=m.desc?m.desc(i,j):'';
    showTip(e,`${esc(m.label)}${ds?' · '+esc(ds):''} = <b>${f3(v)}</b>`);
    hovering=true;hl(el.dataset.t.split(' ').filter(Boolean));
  }else if(cls&&cls.contains('thumb')){
    const n=+el.dataset.sel;showTip(e,`картинка ${IDN[n]}, цифра ${CN[CLS[n]]} — клик, чтобы выбрать`);
    hovering=true;hl([ks(n)]);
  }else{tip.style.opacity=0;if(hovering){hovering=false;hl(null);}}
});
svg.addEventListener('pointerleave',()=>{tip.style.opacity=0;hovering=false;hl(null);});
svg.addEventListener('click',e=>{if(dragMoved)return;const el=e.target;if(el.classList&&el.classList.contains('thumb'))selectSample(+el.dataset.sel);});

/* ---------- pan / zoom ---------- */
let drag=null,dragMoved=false;
function toFree(){if(!state.free){state.free=true;$('recenter').style.display='block';}}
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(anim)cancelAnimationFrame(anim);dragMoved=false;drag={x:e.clientX,y:e.clientY,vb:{...vb},moved:false,id:e.pointerId};});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;const r=svg.getBoundingClientRect();
  const s=Math.max(drag.vb.w/r.width,drag.vb.h/r.height);
  const dx=(e.clientX-drag.x)*s,dy=(e.clientY-drag.y)*s;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;dragMoved=true;svg.setPointerCapture(drag.id);svg.classList.add('dragging');toFree();tip.style.opacity=0;hovering=false;hl(null);}
  if(drag.moved)setVB({...drag.vb,x:drag.vb.x-dx,y:drag.vb.y-dy});
});
const end=()=>{drag=null;svg.classList.remove('dragging');};
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
/* Встроенная в статью карта не должна перехватывать прокрутку страницы:
   масштаб там только с Ctrl/⌘ (щипок на тачпаде тоже приходит с ctrlKey). */
const embedded=window.self!==window.top;
if(embedded){const h=document.querySelector('.hint');h.textContent=h.textContent.replace('колесо','Ctrl + колесо');}
svg.addEventListener('wheel',e=>{
  if(embedded&&!e.ctrlKey&&!e.metaKey)return;
  e.preventDefault();if(anim)cancelAnimationFrame(anim);
  const r=svg.getBoundingClientRect();const s=Math.max(vb.w/r.width,vb.h/r.height);
  const ox=vb.x+(vb.w-r.width*s)/2,oy=vb.y+(vb.h-r.height*s)/2;
  const px=ox+(e.clientX-r.left)*s,py=oy+(e.clientY-r.top)*s;
  const k=Math.min(4,Math.max(.25,Math.pow(1.0018,e.deltaY)));
  const nw=Math.min(8000,Math.max(200,vb.w*k)),kk=nw/vb.w;
  setVB({x:px-(px-vb.x)*kk,y:py-(py-vb.y)*kk,w:vb.w*kk,h:vb.h*kk});toFree();
},{passive:false});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!state.free)camera();},120);});

/* ---------- theme ----------
   Сайт хранит выбранную тему в localStorage.theme; iframe того же origin
   читает её при загрузке и ловит переключение через событие storage.
   Цвета клеток считаются в build() через isDark(), поэтому нужен rebuild(). */
function siteTheme(){try{return localStorage.getItem('theme');}catch(e){return null;}}
