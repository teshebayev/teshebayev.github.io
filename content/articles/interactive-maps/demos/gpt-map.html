<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта мини-GPT</title>
<style>
:root{
  --blue:#3576C0; --yellow:#C29E08; --red:#C30B0A; --green:#73B222;
  --gray:#5E5850; --violet:#7B4FB0; --ink:#111111; --line:#E3DFD8; --soft:#F6F5F2;
  --h1:var(--blue); --h2:var(--yellow); --h3:var(--green); --h4:var(--violet);
}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.45}
body{height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header.top{padding:16px 24px 10px;border-bottom:1px solid var(--line)}
header.top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--gray);font-size:14px}
.picker{display:flex;align-items:center;gap:10px 14px;padding:9px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.picker .lbl{color:var(--gray);font-size:14px}
#txt{font:inherit;font-size:16px;padding:5px 10px;border:1px solid var(--ink);border-radius:4px;width:min(440px,100%);font-family:"Courier New",Courier,monospace}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px;font-size:13px}
.chip:hover{border-color:var(--gray)}
.warn{font-size:13px;color:var(--gray)}
.warn b{color:var(--red);font-weight:400}
.ctl{display:inline-flex;align-items:center;gap:8px}
input[type=range]{width:120px;accent-color:var(--ink)}
.btn{border:1px solid var(--ink);background:#fff;border-radius:4px;padding:6px 12px;font-size:14px}
.btn.primary{background:var(--ink);color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;grid-template-rows:minmax(0,1fr);flex:1 1 0;min-height:560px}
.mapbox{position:relative;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.maptools{display:flex;gap:8px 14px;align-items:center;padding:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--gray)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 10px;font-size:13px;color:var(--gray)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
#map{flex:1;width:100%;min-height:0;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
#map image{image-rendering:pixelated;image-rendering:crisp-edges}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;padding:6px 14px 10px;font-size:13px;color:var(--gray)}
.legend i{display:inline-block;vertical-align:-1px;margin-right:5px;width:12px;height:12px;border-radius:2px}
#tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--ink);padding:6px 9px;font-size:13px;border-radius:3px;display:none;white-space:nowrap;z-index:5}
aside.panel{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.guide{padding:16px 20px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.dots{display:flex;gap:5px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--gray);background:#fff;padding:0}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots button.done{background:var(--gray);border-color:var(--gray)}
.dots span{margin-left:auto;font-size:13px;color:var(--gray)}
.guide h2{margin:0 0 6px;font-size:18px;line-height:1.25}
.guide .txt p{margin:0 0 8px}
.guide .nav{display:flex;gap:8px;margin-top:8px}
.insp{padding:14px 20px 28px}
.insp h3{font-size:16px;margin:0 0 2px}
.insp h4{font-size:14px;margin:18px 0 6px}
.insp .cap{font-size:13px;color:var(--gray);margin:2px 0 8px}
.insp p{margin:0 0 8px}
.formula{font-family:"Times New Roman",Times,serif;font-size:18px;margin:6px 0;white-space:nowrap;overflow-x:auto}
.shape{font-size:13px;color:var(--gray)}
.mini{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;align-items:center;font-size:13px;color:var(--gray);margin:6px 0}
.mini img{width:100%;height:14px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:1px solid var(--line)}
.bars{display:grid;grid-template-columns:92px 1fr 58px;gap:3px 8px;align-items:center;font-size:13px}
.bars .nm{text-align:right;color:var(--gray);background:none;border:0;padding:0;font-size:13px;white-space:nowrap}
.bars button.nm:hover{color:var(--ink);text-decoration:underline}
.bars .track{position:relative;height:12px}
.bars .track b{position:absolute;top:0;left:0;height:12px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.vocab{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.vocab span{border:1px solid var(--line);text-align:center;font-size:14px;padding:2px 0 1px;line-height:1.15;font-family:"Courier New",Courier,monospace}
.vocab span small{display:block;color:var(--gray);font-size:10px;font-family:Helvetica,Arial,sans-serif}
.vocab span.on{border-color:var(--ink);background:var(--soft)}
.heads4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.heads4 button{padding:0;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--gray)}
.heads4 button.on{outline:2px solid var(--ink)}
.heads4 img{width:100%;aspect-ratio:1;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
table.kv{border-collapse:collapse;font-size:14px;margin:6px 0}
table.kv td{padding:2px 14px 2px 0;vertical-align:top}
table.kv td.v{text-align:right;font-variant-numeric:tabular-nums}
table.kv tr.tot td{border-top:1px solid var(--ink);font-weight:700}
.note{font-size:13px;color:var(--gray);border-left:3px solid var(--line);padding-left:8px;margin-top:10px}
.mono{font-family:"Courier New",Courier,monospace}
@media (max-width:980px){
  body{height:auto;display:block}
  .wrap{grid-template-columns:1fr;grid-template-rows:auto;height:auto}
  .mapbox{height:72vh;border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Карта мини-GPT</h1>
  <p id="sub"></p>
</header>
<div class="picker">
  <label class="lbl" for="txt">Текст:</label>
  <input id="txt" autocomplete="off" spellcheck="false" maxlength="400">
  <button class="btn primary" id="genOne">Следующий символ</button>
  <button class="btn" id="genMany">Писать дальше</button>
  <span class="warn" id="warn"></span>
</div>
<div class="picker">
  <span class="lbl">Начала:</span><div class="presets" id="presets"></div>
  <span class="ctl"><label class="lbl" for="temp">Температура</label><input type="range" id="temp" min="0.1" max="2" step="0.05" value="0.8"><b id="tempV"></b></span>
  <span class="ctl"><span class="lbl">Отбор</span><div class="seg" id="sampSeg"><button data-v="greedy">жадно</button><button data-v="topk">top-k = 5</button><button data-v="topp">top-p = 0.9</button><button data-v="all">все символы</button></div></span>
</div>
<main class="wrap">
  <section class="mapbox">
    <div class="maptools">
      <span>Блок</span><div class="seg" id="blockSeg"><button data-v="0">1</button><button data-v="1">2</button></div>
      <span>Голова</span><div class="seg" id="headSeg"></div>
      <span>Матрица</span><div class="seg" id="attSeg"><button data-v="scores">оценки q·k/√d</button><button data-v="masked">с маской</button><button data-v="softmax">веса</button></div>
      <button class="btn" id="resetView" style="padding:3px 9px;font-size:13px">Вся карта</button><button class="btn" id="stepView" style="padding:3px 9px;font-size:13px">Камера к шагу</button>
    </div>
    <svg id="map" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" aria-label="Карта мини-GPT: символы, векторы, внимание и вероятности"></svg>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>положительное значение</span>
      <span><i style="background:#8f8a82"></i>отрицательное</span>
      <span><i style="background:linear-gradient(90deg,var(--h1) 25%,var(--h2) 25% 50%,var(--h3) 50% 75%,var(--h4) 75%)"></i>вес внимания головы 1–4</span>
      <span><i style="background:#f3cfcf"></i>маска</span>
      <span><i style="background:var(--green)"></i>вероятность</span>
      <span><i style="background:var(--red)"></i>потеря</span>
    </div>
    <div id="tip"></div>
  </section>
  <aside class="panel">
    <div class="guide">
      <div class="dots" id="dots"></div>
      <h2 id="gTitle"></h2>
      <div class="txt" id="gText"></div>
      <div class="nav"><button class="btn" id="gPrev">Назад</button><button class="btn primary" id="gNext">Далее</button></div>
    </div>
    <div class="insp" id="insp"></div>
  </aside>
</main>

function linear(x,W,b,nin,nout){const y=new Float64Array(nout);for(let o=0;o<nout;o++){let s=b?b[o]:0;const r=o*nin;for(let i=0;i<nin;i++)s+=W[r+i]*x[i];y[o]=s;}return y;}
function layerNorm(x,g,b){const n=x.length;let mu=0;for(let i=0;i<n;i++)mu+=x[i];mu/=n;let va=0;for(let i=0;i<n;i++)va+=(x[i]-mu)*(x[i]-mu);va/=n;

    for(let t=0;t<n;t++){const a=layerNorm(X[t],p('ln1.weight'),p('ln1.bias'));B.ln1.push(a);
      const qkv=linear(a,p('qkv.weight'),p('qkv.bias'),DM,3*DM);B.q.push(qkv.slice(0,DM));B.k.push(qkv.slice(DM,2*DM));B.v.push(qkv.slice(2*DM));}

    F.blocks.push(B);X=B.r2;}
  for(let t=0;t<n;t++){const a=layerNorm(X[t],P['lnf.weight'],P['lnf.bias']);F.lnf.push(a);

  F.meanLoss=F.loss.length?F.loss.reduce((a,b)=>a+b,0)/F.loss.length:NaN;
  return F;
}

function imgURL(rows,colorFn,cw,rh,gapX){
  const n=rows.length,d=rows[0].length,W=d*cw,H=n*rh;

/* ---------- sampling ---------- */
function dist(lg){
  const p=softmax(lg,S.temp),ord=[...p.keys()].sort((a,b)=>p[b]-p[a]),keep=new Uint8Array(NV);
  if(S.samp==='greedy')keep[argmax(lg)]=1;
  else if(S.samp==='topk')ord.slice(0,5).forEach(i=>keep[i]=1);
  else if(S.samp==='topp'){let c=0;for(const i of ord){keep[i]=1;c+=p[i];if(c>=0.9)break;}}
  else keep.fill(1);
  let z=0;for(let i=0;i<NV;i++)if(keep[i])z+=p[i];
  const qn=new Float64Array(NV);for(let i=0;i<NV;i++)qn[i]=keep[i]?p[i]/z:0;
  return {p,ord,keep,qn};
}
function sampleNext(){
  const F=S.F,ds=dist(F.logits[F.n-1]);let r=Math.random(),k=ds.ord[0];

  return VOC[k];
}

function stripData(id){
  const F=S.F,B=F.blocks[S.block],h=S.head,sl=r=>r.slice(h*DH,h*DH+DH);
  switch(id){
    case'wte':return F.te;case'wpe':return F.pe;case'x0':return F.x0;case'xin':return B.xin;case'ln1':return B.ln1;
    case'q':case'k':case'v':return B[id].map(sl);case'yh':return B.y.map(sl);case'cat':return B.y;case'wo':return B.ao;
    case'r1':return B.r1;case'ln2':return B.ln2;case'hid':return B.hid;case'mo':return B.mo;case'r2':return B.r2;case'lnf':return F.lnf;}
  return null;
}

function el(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.appendChild(e);return e;}

function charsColumn(c,arcs){
  const n=S.F.n;
  for(let t=0;t<n;t++){
    const y=ry(c,t),ch=chAt(t);
    el('rect',{x:c.x0,y,width:20,height:RH-1,fill:t===S.t?'#111':'#F6F5F2',rx:2},gOver);
    el('text',{x:c.x0+10,y:y+9.5,'text-anchor':'middle','font-size':11,'font-family':'Courier New,monospace',fill:t===S.t?'#fff':'#111'},gOver,disp(ch));
    el('text',{x:c.x0+28,y:y+9.5,'font-size':9.5,fill:GRAY},gOver,S.ids[t]);
    if(!arcs)continue;
    el('text',{x:c.x0-4,y:y+9,'text-anchor':'end','font-size':8,fill:'#a39d94'},gOver,t);
  }
  el('rect',{x:c.x0,y:c.y0,width:c.w,height:n*RH,fill:'transparent','data-col':c.id},gHit);
}

   el('rect',{x:c.x0,y:c.y0,width:n*RH,height:n*RH,fill:'transparent','data-col':'att'},gHit);}
  /* дуги внимания выбранной позиции */
  {const c=C.chars,Am=B.att[h],t=S.t,x=c.x0-20;
   for(let j=0;j<=t;j++){const a=Am[t][j];if(a<0.02)continue;

function mini(label,v,m){return `<div class="mini"><span>${label}</span><img alt="" src="${vecURL([v],m==null?maxAbs([v]):m)}"></div>`;}
function bars(items,max,color){return '<div class="bars">'+items.map(it=>`<${it.go?'button':'span'} class="nm"${it.go?` data-go="${it.go}"`:''}>${it.n}</${it.go?'button':'span'}><span class="track"><b style="width:${Math.max(1,100*Math.abs(it.v)/max)}%;background:${it.c||color}"></b></span><span class="val">${it.s!=null?it.s:f(it.v,3)}</span>`).join('')+'</div>';}
const posLbl=t=>`${q(chAt(t))} поз. ${t}`;
function headRole(hs){
  const o=hs.off;
  if(o[0]>=0.45)return `на себя: ${pct(o[0])}`;
  if(o[1]>=0.4)return `на предыдущий символ: ${pct(o[1])}`;
  if(o[2]>=0.35)return `на символ два шага назад: ${pct(o[2])}`;
  if(hs.space>=0.35)return `на последний пробел, то есть на начало текущего слова: ${pct(hs.space)}`;
  const parts=[['на себя',o[0]],['на предыдущий',o[1]],['на два назад',o[2]],['на пробел',hs.space]].sort((a,b)=>b[1]-a[1]);
  return `вес делится: ${parts.slice(0,3).map(p=>p[0]+' '+pct(p[1])).join(', ')}`;
}
function headStatsHTML(l,h){
  const hs=D.heads[l*NH+h];
  const items=hs.off.map((v,o)=>({n:o===0?'на себя':'−'+o,v,s:pct(v),c:HCSS[h]}));
  items.push({n:'пробел',v:hs.space,s:pct(hs.space),c:HCSS[h]});
  return `<p class="cap">Средний вес по 2 000 отрывкам отложенного текста (позиции 12–31): куда смотрит голова ${h+1} блока ${l+1}. «−2» — на символ двумя позициями раньше, «пробел» — на ближайший пробел слева.</p>`+bars(items,Math.max(...items.map(i=>i.v)))+
    `<p class="cap" style="margin-top:6px">Энтропия строки внимания ${f(hs.ent,2)} нат: вес в среднем размазан примерно на e<sup>${f(hs.ent,2)}</sup> ≈ ${f(Math.exp(hs.ent),1)} символа.</p>`;
}

    H=`<h3>Эмбеддинг символа</h3>${where}<p>Номер ${S.ids[t]} выбирает строку ${S.ids[t]} из таблицы wte размером ${NV} × ${DM}. Эти ${NV*DM} чисел подобраны обучением, как и все остальные веса.</p>

  case'wpe':{

  case'x0':{const m=maxAbs([F.te[t],F.pe[t],F.x0[t]]);

    ${mini('wte['+S.ids[t]+']',F.te[t],m)}${mini('+ wpe['+t+']',F.pe[t],m)}${mini('= x⁰',F.x0[t],m)}
    <p>Покоординатная сумма, ${DM} чисел. Дальше каждая позиция идёт своей строкой через оба блока: на каждом шаге к строке что-то прибавляется, длина остаётся ${DM}.</p>`;break;}
  case'xin':H=`<h3>Вход блока ${S.block+1}</h3>${where}<p>${S.block===0?'Первый блок получает x⁰.':'Второй блок получает выход первого: x⁰ плюс всё, что прибавили внимание и MLP первого блока.'} Устройство блоков одинаковое, веса у каждого свои.</p>${mini('вход',B.xin[t])}<p class="cap">Длина вектора ‖x‖ = ${f(norm(B.xin[t]),2)}.</p>`;break;
  case'ln1':case'ln2':case'lnf':{

    <p>Берём ${DM} чисел одной позиции, вычитаем их среднее μ и делим на стандартное отклонение σ. Получаем среднее 0 и разброс 1, потом каждую координату масштабирует γ<sub>i</sub> и сдвигает β<sub>i</sub>. γ и β — ${DM}+${DM} обучаемых чисел этого слоя.</p>

    ${mini('до',src)}${mini('после',out)}
    <p class="cap">${id==='lnf'?'Последняя нормализация перед выходом: после неё вектор умножается на wteᵀ.':'Нормализуется только копия, которая идёт '+(id==='ln1'?'во внимание':'в MLP')+'. Сам поток x в остаточную связь идёт без изменений.'}</p>`;break;}
  case'q':case'k':case'v':{
    const qv=B.q[t].slice(h*DH,h*DH+DH),kv=B.k[t].slice(h*DH,h*DH+DH),vv=B.v[t].slice(h*DH,h*DH+DH),m=maxAbs([qv,kv,vv]);
    const dots=[];for(let j=0;j<=t;j++)dots.push({j,s:B.scores[h][t][j]});dots.sort((a,b)=>b.s-a.s);
    H=`<h3>Q, K, V</h3>${where}<div class="formula">q = LN(x)·W<sub>Q</sub> + b, &nbsp; k = LN(x)·W<sub>K</sub> + b, &nbsp; v = LN(x)·W<sub>V</sub> + b</div>
    <p class="shape">${DM} → ${DM} для каждой матрицы; голова ${h+1} берёт свой кусок из ${DH} координат (${h*DH}–${h*DH+DH-1}).</p>

  case'att':{
    const A=B.att[h][t],Sr=B.scores[h][t],ws=[];for(let j=0;j<=t;j++)ws.push({j,a:A[j],s:Sr[j]});ws.sort((x,y)=>y.a-x.a);
    const minis=[0,1,2,3].map(hh=>{const Am=B.att[hh];return `<button class="${hh===h?'on':''}" data-head="${hh}"><img alt="" src="${imgURL(Am,(v,i,j)=>j>i?FUTC:mix(HRGB[hh],Math.pow(Am[i][j],0.7)),3,3,false)}">голова ${hh+1}</button>`;}).join('');
    const kv=S.key!=null?`<p>Выбрана пара: позиция ${t} ${q(chAt(t))} → позиция ${S.key} ${q(chAt(S.key))}. Оценка ${f(Sr[S.key],3)}${S.key>t?' — это будущее, маска заменит её на −∞, вес 0.':`, вес a = ${f(A[S.key],3)}.`}</p>`:'';
    const mode={scores:`<div class="formula">s<sub>tj</sub> = q<sub>t</sub>·k<sub>j</sub> / √${DH}</div><p>Матрица ${n} × ${n}: каждая позиция сравнивает свой q с k всех позиций, включая будущие. Делим на √${DH} = 4, чтобы при ${DH} слагаемых суммы не разрастались и softmax не превращался в один пик.</p>`,
      masked:`<div class="formula">s<sub>tj</sub> = −∞ при j &gt; t</div><p>При обучении сеть угадывает каждый следующий символ по предыдущим. Если позиция t видит символ t+1, она просто списывает ответ. Поэтому всё правее диагонали заменяется на −∞ до softmax: e<sup>−∞</sup> = 0.</p>`,

    <h4>Куда смотрит позиция ${t}</h4>${bars(ws.slice(0,7).map(w=>({n:posLbl(w.j),v:w.a,s:pct(w.a),c:HCSS[h],go:'key:'+w.j})),1)}
    <h4>Четыре головы блока ${S.block+1}</h4><div class="heads4">${minis}</div>

  case'yh':{
    const ws=[];for(let j=0;j<=t;j++)ws.push({j,a:B.att[h][t][j]});ws.sort((x,y)=>y.a-x.a);
    const yv=B.y[t].slice(h*DH,h*DH+DH),m=maxAbs([yv,...ws.slice(0,3).map(w=>B.v[w.j].slice(h*DH,h*DH+DH))]);
    H=`<h3>Взвешенная сумма значений</h3>${where}<div class="formula">y<sub>${t}</sub> = Σ<sub>j≤${t}</sub> a<sub>${t}j</sub> · v<sub>j</sub></div>
    <p>Голова ${h+1} складывает векторы v всех видимых позиций с весами из строки ${t}. Результат — ${DH} чисел.</p>

  case'cat':case'wo':{
    H=`<h3>${id==='cat'?'Четыре головы рядом':'Проекция Wₒ'}</h3>${where}<div class="formula">Δ = [y⁽¹⁾ y⁽²⁾ y⁽³⁾ y⁽⁴⁾]·W<sub>O</sub> + b</div>
    <p>Выходы четырёх голов по ${DH} чисел ставятся рядом в вектор из ${DM}. Матрица W<sub>O</sub> ${DM} × ${DM} смешивает их: каждая выходная координата — взвешенная сумма всех ${DM} координат всех голов.</p>
    ${[0,1,2,3].map(hh=>mini(`<span style="color:${HCSS[hh]}">голова ${hh+1}</span>`,B.y[t].slice(hh*DH,hh*DH+DH),maxAbs([B.y[t]]))).join('')}
    ${mini('·Wₒ = Δ',B.ao[t])}<p class="cap">‖Δ‖ = ${f(norm(B.ao[t]),2)}.</p>`;break;}

    H=`<h3>${id==='mo'?'Выход MLP':'Остаточная связь'}</h3>${where}<div class="formula">x ← x + ${id==='r1'?'Внимание(LN(x))':'MLP(LN(x))'}</div>
    <p>${id==='r1'?'Внимание':'MLP'} не заменяет вектор позиции. Оно считает поправку Δ из ${DM} чисел, и её прибавляют к x. Так через сеть идёт один поток: x⁰, к которому по очереди прибавляют вклады всех слоёв.</p>
    ${mini('x',x,m)}${mini('+ Δ',d,m)}${mini('= новый x',out,m)}
    <table class="kv"><tr><td>‖x‖</td><td class="v">${f(norm(x),2)}</td></tr><tr><td>‖Δ‖</td><td class="v">${f(norm(d),2)}</td></tr></table>
    <p class="cap">Без этой связи градиент к первым слоям проходил бы через все нелинейности подряд. С ней у градиента есть прямой путь по сумме.</p>`;break;}
  case'hid':{

    <h4>Нейрон № ${top} на всех позициях текста</h4>${bars(pos.slice(0,6).map(p=>({n:posLbl(p.i),v:p.v,c:'#3576C0',go:'t:'+p.i})),Math.max(pos[0].v,1e-9))}`;break;}

    ${n>1?`<p>Средняя потеря на этом тексте: ${f(F.meanLoss,3)}. При обучении именно это число по миллионам позиций и уменьшал градиентный спуск.</p><h4>Где сеть удивилась сильнее всего</h4>${bars(worst.map(w=>({n:posLbl(w.i),v:w.L,c:'#C30B0A',s:f(w.L,2),go:'t:'+w.i})),worst[0].L)}<p class="cap">Позиция ${q(chAt(worst[0].i))} → дальше ${q(chAt(worst[0].i+1))}: сеть дала ему ${pct(F.probs[worst[0].i][S.ids[worst[0].i+1]])}.</p>`:''}`;break;}

    <p>Температура T делит логиты перед softmax. T &lt; 1 растягивает разрывы между ними, и первый символ забирает почти всё. T &gt; 1 сжимает разрывы, и вероятности выравниваются.</p>
    <table class="kv"><tr class="shape"><td></td><td class="v">z</td><td class="v">T = 1</td><td class="v">T = ${S.temp.toFixed(2)}</td><td class="v">отбор</td></tr>
    ${top.map(i=>`<tr${i===nx?' style="color:var(--violet)"':''}><td class="mono">${disp(VOC[i])}</td><td class="v">${f(lg[i],2)}</td><td class="v">${pct(p1[i])}</td><td class="v">${pct(ds.p[i])}</td><td class="v">${ds.keep[i]?pct(ds.qn[i]):'—'}</td></tr>`).join('')}</table>
    <p>${{greedy:'Жадный выбор всегда берёт первый символ. Текст получается детерминированным и быстро зацикливается на частых словах.',topk:'Top-k оставляет 5 самых вероятных символов, делит их вероятности на их сумму и тянет жребий.',topp:'Top-p берёт символы по убыванию, пока их сумма не достигнет 0.9, и тянет жребий среди них. Когда сеть уверена, остаётся 1–2 символа; когда нет — больше.',all:'Жребий среди всех символов: изредка выпадают маловероятные, и в тексте появляются опечатки.'}[S.samp]}</p>
    ${nx!=null?`<p style="color:var(--violet)">В тексте дальше идёт ${q(VOC[nx])}: p = ${pct(p1[nx])} при T = 1, потеря ${f(-Math.log(p1[nx]),3)}.</p>`:'<p>Это последняя позиция: её прогноз и дописывает кнопка «Следующий символ».</p>'}`;break;}
  }
  insp.innerHTML=H;
}

 {t:'Эмбеддинг символа',cam:['chars','wpe'],apply(){S.sel='wte';},
  txt:F=>`<p>Номер выбирает строку из таблицы wte размером ${NV} × ${DM}. Одинаковые символы получают одинаковые строки: посмотрите на столбец «Эмбеддинг символа» — строки с одной и той же буквой совпадают.</p><p>Справа все ${NV} строк таблицы, сжатые до двух координат.</p>`},
 {t:'Позиция и сумма',cam:['wte','x0'],apply(){S.sel='x0';},
  txt:F=>`<p>Вторая таблица, wpe, хранит по вектору на каждую из ${T} позиций. Её строка прибавляется к эмбеддингу символа: x⁰ = wte[id] + wpe[t].</p><p>После сложения одинаковые буквы на разных местах дают разные векторы. Без этого внимание не отличило бы «кот» от «ток».</p>`},
 {t:'LayerNorm',cam:['x0','ln1'],apply(){S.sel='ln1';S.block=0;},
  txt:F=>`<p>Перед вниманием копия каждой строки нормализуется: из ${DM} чисел вычитается их среднее, результат делится на стандартное отклонение, потом масштабируется обучаемыми γ и β.</p><p>Это держит числа в одном масштабе в каждом блоке, и обучение идёт устойчивее.</p>`},
 {t:'Q, K и V',cam:['ln1','v'],apply(){S.sel='q';S.block=0;S.head=PREV0;},
  txt:F=>`<p>Три матрицы ${DM} × ${DM} превращают нормализованную строку в три вектора: запрос q, ключ k и значение v. Каждый режется на ${NH} куска по ${DH} чисел — по куску на голову. На карте — кусок головы ${S.head+1}.</p><p>Q, K, V считаются для каждой позиции одними и теми же матрицами.</p>`},
 {t:'Оценки q·k/√d',cam:['q','att'],apply(){S.sel='att';S.attMode='scores';S.key=null;},
  txt:F=>`<p>Для каждой пары позиций (t, j) считается скалярное произведение q<sub>t</sub>·k<sub>j</sub>, делённое на √${DH} = 4. Получается матрица ${F.n} × ${F.n}: строка t — насколько позиция t «подходит» каждой позиции j.</p><p>Строки и столбцы подписаны символами. Посчитаны все пары, в том числе с позициями правее t.</p>`},
 {t:'Маска: будущее закрыто',cam:['q','att'],apply(){S.sel='att';S.attMode='masked';},
  txt:F=>`<p>Сеть учится угадывать следующий символ на каждой позиции сразу. Позиция t не должна видеть символ t+1 — иначе она перепишет ответ.</p><p>Поэтому все оценки правее диагонали заменяются на −∞ до softmax. После softmax их вес равен e<sup>−∞</sup> = 0.</p>`},
 {t:'Softmax: веса внимания',cam:['v','yh'],apply(){S.sel='att';S.attMode='softmax';S.t=S.F.n-1;},
  txt:F=>{const A=F.blocks[S.block].att[S.head][S.t],j=argmax(A);return `<p>Softmax по каждой строке делает веса неотрицательными с суммой 1. Последняя позиция ${q(chAt(S.t))} отдаёт больше всего веса позиции ${j} ${q(chAt(j))}: ${pct(A[j])}.</p><p>Те же веса нарисованы дугами слева от символов. Кликните по другой строке, и дуги перерисуются для неё.</p>`;}},
 {t:'Головы учатся разному',cam:['att','att'],apply(){S.sel='att';S.attMode='softmax';S.block=0;S.head=PREV0;},
  txt:F=>`<p>В блоке 1 четыре головы, и обучение настроило их по-разному. Средний вес на отложенном тексте:</p><ul style="margin:0 0 8px;padding-left:18px">${[0,1,2,3].map(h=>`<li><b style="color:${HCSS[h]}">голова ${h+1}</b> — ${headRole(D.heads[h])}</li>`).join('')}</ul><p>Переключайте головы сверху над картой: у каждой своя матрица весов.</p>`},
 {t:'Смесь значений и Wₒ',cam:['chars2','wo'],apply(){S.sel='yh';S.attMode='softmax';},
  txt:F=>`<p>Каждая голова складывает векторы v видимых позиций с весами из своей строки — получается ${DH} чисел. Четыре головы ставятся рядом в вектор из ${DM}, матрица W<sub>O</sub> смешивает их.</p><p>Только здесь информация переходит между позициями. Все остальные операции блока считаются для каждой строки отдельно.</p>`},
 {t:'Остаточная связь',cam:['cat','r1'],apply(){S.sel='r1';},
  txt:F=>{const B=F.blocks[S.block];return `<p>Результат внимания Δ прибавляется к входу блока: x + Δ. Для позиции ${S.t}: ‖x‖ = ${f(norm(B.xin[S.t]),2)}, ‖Δ‖ = ${f(norm(B.ao[S.t]),2)}.</p><p>Линия над картой от входа блока к «x + внимание» — это и есть копия x, к которой прибавляется Δ.</p>`;}},
 {t:'MLP',cam:['r1','r2'],apply(){S.sel='hid';},
  txt:F=>{const hv=F.blocks[S.block].hid[S.t];return `<p>Ещё одна нормализация, затем двухслойная сеть ${DM} → ${DFF} → ${DM} с GELU, отдельно для каждой позиции. Для позиции ${S.t} заметно включены ${[...hv].filter(v=>v>0.05).length} нейронов из ${DFF}.</p><p>Её выход тоже прибавляется к x. После этого строка готова для следующего блока.</p>`;}},
 {t:'Второй блок',cam:['xin','yh'],apply(){S.block=1;S.sel='att';S.attMode='softmax';S.head=SPACE1;},
  txt:F=>`<p>Второй блок устроен так же, веса другие. На вход он получает выход первого: векторы, к которым внимание первого блока уже прибавило взвешенные суммы v соседних позиций.</p><p>Головы второго блока не выделяют одно смещение так резко:</p><ul style="margin:0 0 8px;padding-left:18px">${[0,1,2,3].map(h=>`<li><b style="color:${HCSS[h]}">голова ${h+1}</b> — ${headRole(D.heads[NH+h])}</li>`).join('')}</ul>`},
 {t:'Логиты и потеря',cam:['r2','dist'],apply(){S.block=1;S.sel='pred';},
  txt:F=>`<p>Выход последнего блока нормализуется и умножается на wteᵀ: ${NV} логитов, по одному на символ. Softmax даёт вероятности.</p><p>Столбец «Прогноз» показывает это на каждой позиции: зелёный — что сеть ждёт, красный — что стоит дальше на самом деле. Средняя потеря на этом тексте ${F.n>1?f(F.meanLoss,2):'—'}; на отложенном тексте Пушкина ${f(D.valLoss,2)}.</p>`},
 {t:'Температура и отбор',cam:['pred','dist'],apply(){S.sel='dist';S.t=S.F.n-1;},
  txt:F=>`<p>Чтобы писать текст, берём прогноз последней позиции и выбираем символ. Ползунок «Температура» делит логиты перед softmax: при T = 0.3 первый символ забирает почти всё, при T = 1.5 распределение почти ровное.</p><p>«Отбор» решает, из каких символов тянуть жребий. Серые столбцы отброшены.</p>`},
 {t:'Генерация символ за символом',cam:null,apply(){S.sel='dist';S.t=S.F.n-1;},
  txt:F=>`<p>Кнопка «Следующий символ» вытягивает символ, дописывает его к тексту и заново считает весь прямой проход. «Писать дальше» повторяет это 40 раз.</p><p>Окно — ${T} символа. Когда текст длиннее, сеть видит только последние ${T}, и всё, что левее, на прогноз уже не влияет.</p>`},
 {t:'Дальше сами',cam:null,apply(){S.sel=null;},
  txt:F=>`<p>Впишите своё начало или возьмите строчку из пресетов. Попробуйте температуру 0.2 и 1.5 на одном начале, и жадный выбор против top-p.</p><p>Наводите на любую клетку — увидите число. Клик по строке выбирает позицию, клик по заголовку столбца открывает его справа.</p>`},
];
function renderGuide(){
  const st=STEPS[S.step];$('#gTitle').textContent=st.t;$('#gText').innerHTML=st.txt(S.F);
  const d=$('#dots');d.textContent='';
  STEPS.forEach((s,i)=>{const b=document.createElement('button');b.className=i===S.step?'on':i<S.step?'done':'';b.title=s.t;b.setAttribute('aria-label','Шаг '+(i+1));b.onclick=()=>goStep(i);d.appendChild(b);});
  const sp=document.createElement('span');sp.textContent=(S.step+1)+' из '+STEPS.length;d.appendChild(sp);
  $('#gPrev').disabled=S.step===0;$('#gNext').textContent=S.step===STEPS.length-1?'В начало':'Далее';
}
function goStep(i){S.step=i;STEPS[i].apply();syncSeg();renderAll();camTo(STEPS[i].cam);}
$('#gPrev').onclick=()=>{if(S.step>0)goStep(S.step-1);};
$('#gNext').onclick=()=>goStep(S.step===STEPS.length-1?0:S.step+1);

/* ---------- controls ---------- */
{const hs=$('#headSeg');for(let h=0;h<NH;h++){const b=document.createElement('button');b.dataset.v=h;b.innerHTML=`<i style="background:${HCSS[h]}"></i>${h+1}`;hs.appendChild(b);}}
function syncSeg(){
  const on=(sel,v)=>document.querySelectorAll(sel+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v)));
  on('#blockSeg',S.block);on('#headSeg',S.head);on('#attSeg',S.attMode);on('#sampSeg',S.samp);
  $('#tempV').textContent=S.temp.toFixed(2);$('#temp').value=S.temp;
}
const segClick=(sel,fn)=>document.querySelectorAll(sel+' button').forEach(b=>b.onclick=()=>{fn(b.dataset.v);syncSeg();renderMap();renderInsp();});
segClick('#blockSeg',v=>{S.block=+v;});
segClick('#headSeg',v=>{S.head=+v;});
segClick('#attSeg',v=>{S.attMode=v;if(!S.sel||!['att','q','k','v','yh'].includes(S.sel))S.sel='att';});
segClick('#sampSeg',v=>{S.samp=v;});
$('#temp').oninput=e=>{S.temp=+e.target.value;syncSeg();renderMap();renderInsp();};
{const pr=$('#presets');D.presets.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>{stopAuto();$('#txt').value=s;setText(s);updWarn([]);};pr.appendChild(b);});}
function updWarn(bad){
  const w=$('#warn');let s='';
  if(bad.length)s+=`<b>Убраны: ${bad.slice(0,6).map(c=>'«'+c+'»').join(' ')}</b> — этих символов нет в словаре. `;
  if(S.full.length>T)s+=`Сеть видит последние ${T} символа из ${S.full.length}.`;
  w.innerHTML=s;
}
$('#txt').addEventListener('input',e=>{
  stopAuto();const inp=e.target,{out,bad}=cleanText(inp.value);
  if(out!==inp.value){const pos=inp.selectionStart-(inp.value.length-out.length);inp.value=out;inp.setSelectionRange(Math.max(0,pos),Math.max(0,pos));}
  setText(out);updWarn(bad);
});
function renderAll(){renderMap();renderInsp();renderGuide();updWarn([]);}

/* ---------- camera, pan/zoom ---------- */
let vb={x:0,y:0,w:MAPW,h:MAPH},anim=null;
const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
/* камера: рамка вокруг перечисленных столбцов (null — вся карта) */
function camTo(ids){
  let to;
  if(!ids)to={x:0,y:0,w:MAPW,h:MAPH};
  else{const cs=ids.map(id=>C[id]),x0=Math.min(...cs.map(c=>c.x0))-(ids.includes('chars')?64:24),x1=Math.max(...cs.map(c=>c.x1))+24;
    const y0=Math.min(...cs.map(c=>c.yo))+20,y1=Math.max(...cs.map(c=>c.yo))+ROWH-20;to={x:x0,y:y0,w:x1-x0,h:y1-y0};
    if(to.w<to.h*0.8){const c=(x0+x1)/2;to.w=to.h*0.8;to.x=c-to.w/2;}}
  if(anim)cancelAnimationFrame(anim);
  if(reduce){vb=to;setVB();return;}
  const from={...vb},t0=performance.now(),dur=420;
  const tick=now=>{const k=Math.min(1,(now-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    for(const key in vb)vb[key]=from[key]+(to[key]-from[key])*e;setVB();if(k<1)anim=requestAnimationFrame(tick);else anim=null;};
  anim=requestAnimationFrame(tick);
}
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
/* Встроенная в статью карта не должна перехватывать прокрутку страницы:
   масштаб там только с Ctrl/⌘ (щипок на тачпаде тоже приходит с ctrlKey). */
const embedded=window.self!==window.top;
svg.addEventListener('wheel',e=>{if(embedded&&!e.ctrlKey&&!e.metaKey)return;e.preventDefault();if(anim){cancelAnimationFrame(anim);anim=null;}
  const pt=svgPt(e),k=Math.exp(e.deltaY*0.0015),nw=Math.max(120,Math.min(MAPW*1.5,vb.w*k)),kk=nw/vb.w;
  vb.x=pt.x-(pt.x-vb.x)*kk;vb.y=pt.y-(pt.y-vb.y)*kk;vb.w=nw;vb.h*=kk;setVB();},{passive:false});
let drag=null,moved=false;
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(anim){cancelAnimationFrame(anim);anim=null;}drag={cx:e.clientX,cy:e.clientY,x:vb.x,y:vb.y,s:svg.getScreenCTM().a};moved=false;});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.cx,dy=e.clientY-drag.cy;
  if(!moved&&Math.hypot(dx,dy)>4){moved=true;svg.classList.add('drag');tip.style.display='none';}
  if(moved){vb.x=drag.x-dx/drag.s;vb.y=drag.y-dy/drag.s;setVB();}});
window.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
$('#resetView').onclick=()=>camTo(null);
$('#stepView').onclick=()=>camTo(STEPS[S.step].cam);

/* ---------- hover and click on the map ---------- */
const tip=$('#tip');
function hitInfo(e){
  const hit=e.target.closest('[data-col]');if(!hit)return null;
  const id=hit.dataset.col,c=C[id],pt=svgPt(e),n=S.F.n;
  if(pt.y<c.y0)return {id,title:true};
  if(id==='dist'){const r=Math.floor((pt.y-c.y0)/30);return {id,r};}
  const t=Math.floor((pt.y-c.y0)/RH);if(t<0||t>=n)return null;
  const o={id,t};
  if(STRIPS.has(id)){const rows=stripData(id),d=rows[0].length;o.i=Math.max(0,Math.min(d-1,Math.floor((pt.x-c.x0)/(c.w/d))));o.v=rows[t][o.i];}
  if(id==='att'){o.j=Math.floor((pt.x-c.x0)/RH);if(o.j<0||o.j>=n)return null;}
  return o;
}
function tipHTML(o){
  const F=S.F,B=F.blocks[S.block],h=S.head;
  if(o.title)return `<b>${NAMES[o.id]}</b>: клик — открыть справа`;
  if(o.id==='dist'){const ds=dist(F.logits[S.t]),i=ds.ord[o.r];if(i==null||o.r>9)return null;return `${q(VOC[i])}: z = ${f(F.logits[S.t][i],2)}, p = ${pct(ds.p[i])}${ds.keep[i]?'':' — отброшен отбором'}`;}
  const at=`позиция ${o.t} ${q(chAt(o.t))}`;
  if(o.id==='chars'||o.id==='chars2')return `${at}: id ${S.ids[o.t]}`;
  if(o.id==='att'){const s=B.scores[h][o.t][o.j];return `${q(chAt(o.t))} (${o.t}) → ${q(chAt(o.j))} (${o.j}): оценка ${f(s,2)}`+(o.j>o.t?', будущее → −∞, вес 0':`, вес ${pct(B.att[h][o.t][o.j])}`);}
  if(o.id==='pred'){const p=F.probs[o.t],k=argmax(p);return `${at}: ждёт ${q(VOC[k])} ${pct(p[k])}`+(o.t<F.n-1?`; дальше ${q(chAt(o.t+1))}: p = ${pct(p[S.ids[o.t+1]])}, L = ${f(F.loss[o.t],2)}`:'');}
  const extra=o.id==='hid'?`, до GELU ${f(B.pre[o.t][o.i],3)}`:'';
  return `<b>${NAMES[o.id]}</b> ${at}, [${o.i}] = ${f(o.v,3)}${extra}`;
}
svg.addEventListener('mousemove',e=>{
  if(drag&&moved)return;const o=hitInfo(e),html=o&&tipHTML(o);
  if(!html){tip.style.display='none';hideBands();return;}
  tip.innerHTML=html;tip.style.display='block';
  const r=svg.parentNode.getBoundingClientRect();let x=e.clientX-r.left+14;if(x+tip.offsetWidth>r.width-4)x=e.clientX-r.left-tip.offsetWidth-10;
  tip.style.left=x+'px';tip.style.top=(e.clientY-r.top+14)+'px';
  hideBands();if(o.t!=null)hoverBands.forEach((b,r)=>{b.setAttribute('y',Y0+r*ROWH+o.t*RH);b.setAttribute('visibility','visible');});
});
const hideBands=()=>hoverBands.forEach(b=>b.setAttribute('visibility','hidden'));
svg.addEventListener('mouseleave',()=>{tip.style.display='none';hideBands();});
svg.addEventListener('click',e=>{
  if(moved){moved=false;return;}
  const o=hitInfo(e);if(!o)return;
  if(o.id==='dist'){S.sel='dist';}
  else{S.sel=o.id==='chars2'?'chars':o.id;if(o.t!=null)S.t=o.t;S.key=o.id==='att'?o.j:null;}
  renderMap();renderInsp();
});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'&&S.step<STEPS.length-1)goStep(S.step+1);
  if(e.key==='ArrowLeft'&&S.step>0)goStep(S.step-1);
});

/* ---------- start ---------- */
$('#sub').textContent=`Посимвольная GPT: ${NL} блока, ${NH} головы внимания, ${nf(D.nParams)} параметров, обучена на ${String(Math.round(D.corpusChars/1e5)/10).replace('.',',')} млн символов Пушкина. Видит до ${T} символов и угадывает следующий.`;
$('#txt').value=D.presets[0];
S.full=D.presets[0];S.ids=[...S.full].map(c=>STOI[c]);S.F=forward(S.ids);S.t=S.ids.length-1;
STEPS[0].apply();syncSeg();renderAll();
vb={x:0,y:0,w:MAPW,h:MAPH};setVB();
/* #step=N в адресе открывает N-й шаг гида */
{const m=location.hash.match(/step=(\d+)/);if(m){const i=Math.max(0,Math.min(STEPS.length-1,+m[1]-1));if(i){STEPS[i].apply();S.step=i;syncSeg();renderAll();const r=reduce;camTo(STEPS[i].cam);}}}
window.__S=S;window.__forward=forward;window.__VOC=VOC;
})();
</script>
</body>
</html>
